[workspace]
members = [
    "crates/utils",
    "crates/database",
    "crates/cache",
    "crates/events",
    "crates/gateway",
    "crates/features/registry",
    "crates/features/antinuke",
    "crates/features/automod",
    "crates/features/premium",
    "crates/embeds",
    "crates/command",
    "app",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
debug = false
incremental = false

[profile.release.package."*"]
opt-level = 3
codegen-units = 1

[profile.dev]
opt-level = 0
debug = 2
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
