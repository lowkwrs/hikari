[package]
name = "hikari-cache"
version = "0.1.0"
edition = "2024"

[dependencies]
hikari-utils = { path = "../utils" }
redis = { version = "0.25", features = ["tokio-comp"] }
tokio = { version = "1.53.1", features = ["sync", "time"] }
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
moka = { version = "0.12", features = ["future"] }
deadpool-redis = "0.15"
bincode = "1.3.3"
