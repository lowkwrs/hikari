[package]
name = "hikari-utils"
version = "0.1.0"
edition = "2024"

[dependencies]
twilight-model = "0.17.1"
twilight-http = { version = "0.17.1", default-features = false, features = ["simd-json", "rustls-native-roots"] }
twilight-util = { version = "0.17.0", features = ["builder"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.44"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
sqlx = { version = "0.9.0", features = ["postgres"] }
redis = { version = "0.25", features = ["tokio-comp"] }
deadpool-redis = "0.15"
tokio = { version = "1.53.1", features = ["sync"] }
dotenvy = "0.15.7"
